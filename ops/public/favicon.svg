<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Rover">
  <!-- Radar mark from Rover logo: bright center + dashed rings -->
  <circle cx="32" cy="32" r="7.5" fill="#2F6BFF"/>
  <!-- Inner ring: 4 dashes -->
  <circle
    cx="32"
    cy="32"
    r="15"
    fill="none"
    stroke="#1A3A8C"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="12 11.5"
    transform="rotate(-45 32 32)"
  />
  <!-- Outer ring: 8 dashes -->
  <circle
    cx="32"
    cy="32"
    r="24"
    fill="none"
    stroke="#1A3A8C"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="9.5 9.3"
    transform="rotate(-11 32 32)"
  />
</svg>
