<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rover loading logos</title>
  <link rel="stylesheet" href="rover-loader.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1a1a1a;
      background: #e8e8e8;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      padding: 1.5rem;
      max-width: 56rem;
      margin: 0 auto;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      border-radius: 12px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      min-height: 12rem;
      justify-content: center;
    }
    .panel--dark { background: #000; color: #fff; }
    .panel--light {
      background: #fff;
      color: #1a3a8c;
      border: 1px solid #d0d0d0;
    }
    .panel h2 {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .note {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 0;
      font-size: 0.9rem;
      color: #444;
    }
  </style>
</head>
<body>
  <p class="note">Dark preview hero (large rings above wordmark) and compact light loader. Site Prepare preview uses the dark hero.</p>
  <div class="grid">
    <section class="panel panel--dark" aria-label="Dark loader">
      <h2>Dark (preview hero)</h2>
      <div class="rover-loader rover-loader--dark rover-loader--hero" role="img" aria-label="Loading">
        <svg class="rover-loader-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
          <circle class="rover-loader-dot" cx="32" cy="32" r="7.5" />
          <g class="rover-loader-ring rover-loader-ring--inner">
            <circle cx="32" cy="32" r="15" transform="rotate(-45 32 32)" />
          </g>
          <g class="rover-loader-ring rover-loader-ring--outer">
            <circle cx="32" cy="32" r="24" transform="rotate(-11 32 32)" />
          </g>
        </svg>
        <img class="rover-loader-word" src="rover-wordmark-dark.png" alt="" width="618" height="81" decoding="async" />
      </div>
    </section>
    <section class="panel panel--light" aria-label="Light loader">
      <h2>Light</h2>
      <div class="rover-loader rover-loader--light" role="img" aria-label="Loading">
        <svg class="rover-loader-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
          <circle class="rover-loader-dot" cx="32" cy="32" r="7.5" />
          <g class="rover-loader-ring rover-loader-ring--inner">
            <circle cx="32" cy="32" r="15" transform="rotate(-45 32 32)" />
          </g>
          <g class="rover-loader-ring rover-loader-ring--outer">
            <circle cx="32" cy="32" r="24" transform="rotate(-11 32 32)" />
          </g>
        </svg>
        <img class="rover-loader-word" src="rover-wordmark-light.png" alt="" width="621" height="84" decoding="async" />
      </div>
    </section>
  </div>
</body>
</html>
